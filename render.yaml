services:
  - type: web
    name: ai-resume-generator-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: AI_REQUEST_TIMEOUT_SECONDS
        value: "60"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: LOG_LEVEL
        value: INFO
      - key: TEMP_FILE_CLEANUP_MINUTES
        value: "5"
    healthCheckPath: /ping
    plan: free
